workflows:
  ios-check:
    name: AIM Smart Reminder iOS compilation check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci 2>/dev/null || npm install
      - name: Verify source checkout
        script: |
          echo "Commit: $(git rev-parse HEAD)"
          pwd
          ls -la
          test -f index.html || { echo 'ERROR: index.html missing from checkout'; exit 1; }
          test -f src/App.jsx || { echo 'ERROR: src/App.jsx missing from checkout'; exit 1; }
      - name: Compile web app
        script: npm run build
      - name: Prepare Capacitor iOS project
        script: |
          if [ ! -d ios/App ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Compile iOS for Simulator (no Apple signing required)
        script: |
          xcodebuild -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - ios/App/build/**
      - /Users/builder/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
